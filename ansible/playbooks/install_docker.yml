- name: Install Docker on Oracle Linux 9
  hosts: jenkins_hosts
  become: true

  tasks:
    - name: Ensure jenkins user exists
      ansible.builtin.user:
        name: jenkins
        shell: /bin/bash

    # Check if the overlay module exists in the system's kernel to determine if the overlay2 storage driver is available.
    - name: Check if overlay module exists in /lib/modules
      ansible.builtin.stat:
        path: "/lib/modules/{{ ansible_kernel }}/kernel/fs/overlayfs/overlay.ko"
      register: overlay_module_stat
      ignore_errors: true

    # If the overlay module is found, use the overlay2 driver. If not, fall back to fuse-overlayfs as an alternative.
    # This dynamic selection ensures compatibility across different environments, improving the portability of the playbook.
    # If the docker daemon fails to start due to the unsupported storage driver, you can skip setting it in the
    # docker_daemon_options below.
    - name: Set storage driver dynamically based on overlay module availability
      ansible.builtin.set_fact:
        docker_storage_driver: "{{ 'overlay2' if overlay_module_stat.stat.exists else 'fuse-overlayfs' }}"

    - name: Install Docker using geerlingguy.docker role
      ansible.builtin.include_role:
        name: geerlingguy.docker
      vars:
        docker_edition: "ce"
        docker_version: "28.0.4"
        docker_packages:
          - "docker-{{ docker_edition }}-{{ docker_version }}"
          - "docker-{{ docker_edition }}-cli-{{ docker_version }}"
          - "docker-{{ docker_edition }}-rootless-extras-{{ docker_version }}"
        docker_packages_state: present

        docker_service_manage: true
        docker_service_state: started
        docker_service_enabled: true
        docker_restart_handler_state: restarted

        docker_compose_version: "2.34.0"
        docker_install_compose_plugin: true
        docker_compose_package_state: present
        docker_compose_package: "docker-compose-plugin-{{ docker_compose_version }}"

        docker_users:
          - jenkins
        docker_daemon_options:
          # If the docker daemon fails to start due to the unsupported storage driver, you can skip setting it
          storage-driver: "{{ docker_storage_driver }}"
          log-opts:
            # Keep up to 5 log files, each max 50MB → so worst-case logs use ~250MB per container.
            max-file: "5"
            max-size: "50m"
