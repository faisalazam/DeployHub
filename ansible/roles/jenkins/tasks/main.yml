---

- name: Check if {{ jenkins_git_dir }} exists
  ansible.builtin.stat:
    path: "{{ jenkins_git_dir }}"
  register: jenkins_git_dir_stat

- name: Remove non-git directory if exists (protect idempotency)
  ansible.builtin.file:
    state: absent
    path: "{{ jenkins_dest_dir }}"
  when: not jenkins_git_dir_stat.stat.exists

- name: Clone Jenkins deployment repository
  ansible.builtin.git:
    repo: "{{ jenkins_repo_url }}"
    dest: "{{ jenkins_dest_dir }}"
    force: "{{ jenkins_git_force }}"
    update: "{{ jenkins_git_update }}"
  notify: "{{ jenkins_restart_handler }}"
  register: git_clone_result

- name: Set proper permissions on {{ jenkins_dest_dir }}
  ansible.builtin.file:
    state: directory
    path: "{{ jenkins_dest_dir }}"
    mode: "{{ jenkins_dir_mode }}"
  when: git_clone_result.changed

- name: Ensure certs directory exists
  ansible.builtin.file:
    state: directory
    mode: "{{ jenkins_dir_mode }}"
    path: "{{ jenkins_registry_cert_dir }}"

- name: Generate registry certificate
  ansible.builtin.command: >
    openssl req
    -newkey rsa:{{ jenkins_registry_cert_key_size }} -nodes -sha256
    -keyout {{ jenkins_registry_cert_key_file }}
    -x509 -days {{ jenkins_registry_cert_days }}
    -out {{ jenkins_registry_cert_crt_file }}
    -subj /CN={{ jenkins_registry_cert_cn }}
    -addext subjectAltName=DNS:{{ jenkins_registry_cert_cn }}
  args:
    chdir: "{{ jenkins_dest_dir }}/docker/jenkins"
    creates: "{{ jenkins_registry_cert_crt_file }}"
  notify: "{{ jenkins_restart_handler }}"

