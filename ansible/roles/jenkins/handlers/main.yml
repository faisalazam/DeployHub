---

- name: "{{ jenkins_restart_handler }}"
  ansible.builtin.command: docker compose up -d --build --remove-orphans
  args:
    chdir: /opt/jenkins/docker/jenkins
  become: true
  notify: "{{ jenkins_server_started_test_handler }}"

- name: "{{ jenkins_server_started_test_handler }}"
  ansible.builtin.command: sh tests/test_jenkins.sh
  args:
    chdir: /opt/jenkins/docker/jenkins
